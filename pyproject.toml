[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sid2tracker"
version = "0.1.0"
description = "Convert Commodore 64 SID tunes into tracker modules (Impulse Tracker .it)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sid2tracker contributors" }]
keywords = ["sid", "c64", "commodore", "impulse-tracker", "tracker", "hvsc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = []

[project.scripts]
sid2it = "sid2it.cli:main"

[tool.setuptools.packages.find]
include = ["sidengine*", "sid2it*"]
